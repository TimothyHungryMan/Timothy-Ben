<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA ITEMS</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #f1f1f1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
            margin: 0;
        }
        .header-title {
            color: #8e9297;
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            padding-left: 4px;
        }
        /* Two-column media grid layout matching your reference */
        .media-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
        }
        /* Card frame container for each picture */
        .media-card {
            background-color: #090c10;
            border: 1px solid #161b22;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .media-img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="header-title">MEDIA ITEMS</div>
